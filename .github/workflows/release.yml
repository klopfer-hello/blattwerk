name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches VERSION
        run: |
          [ "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME" ] || { echo "VERSION file does not match $GITHUB_REF_NAME" >&2; exit 1; }
      - run: bash scripts/test.sh

  images:
    name: Images (build, gate, push)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_REF_NAME#v}+$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build and gate locally first: exactly these images are pushed (a second build could differ).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          target: runtime
          load: true
          tags: blattwerk-api:release
          build-args: VERSION=${{ steps.v.outputs.build }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          tags: blattwerk-web:release
          build-args: VERSION=${{ steps.v.outputs.build }}
      - name: No Claude Code CLI in the images
        run: bash scripts/check-image.sh blattwerk-api:release blattwerk-web:release
      - name: Trivy (api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blattwerk-api:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy (web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blattwerk-web:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested images
        env:
          PREFIX: ${{ steps.v.outputs.prefix }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for part in api web; do
            for tag in "$VERSION" latest; do
              docker tag "blattwerk-$part:release" "$PREFIX-$part:$tag"
              docker push "$PREFIX-$part:$tag"
            done
          done

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changelog from conventional commits
        run: |
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          log="$(git log --no-merges --pretty=format:'%s (%h)' "$range")"
          section() {
            lines="$(printf '%s\n' "$log" | grep -E "^$2(\([^)]*\))?!?: " | sed -E 's/^[a-z]+(\([^)]*\))?!?: /- /' || true)"
            [ -n "$lines" ] && printf '### %s\n\n%s\n\n' "$1" "$lines" || true
          }
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            section Features feat
            section Fixes fix
            section Documentation docs
            other="$(printf '%s\n' "$log" | grep -vE '^(feat|fix|docs)(\([^)]*\))?!?: ' | sed '/^$/d; s/^/- /' || true)"
            [ -n "$other" ] && printf '### Other\n\n%s\n\n' "$other" || true
            printf '**Images:** `%s-web:%s`, `%s-api:%s`\n\n' "$prefix" "${GITHUB_REF_NAME#v}" "$prefix" "${GITHUB_REF_NAME#v}"
            printf 'Update: see docs/self-hosting.md (switch.sh with the new version).\n'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
