# Throwaway test stack (scripts/test.sh): PostgreSQL with data in tmpfs, fixed
# test-only credentials. Project name blattwerk-test.
services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: blattwerk_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "blattwerk_test"]
      interval: 2s
      retries: 30
  tests:
    build:
      context: .
      target: test
    environment:
      BW_TEST_DATABASE_URL: postgresql+psycopg://test:test@postgres:5432/blattwerk_test
    depends_on:
      postgres:
        condition: service_healthy
