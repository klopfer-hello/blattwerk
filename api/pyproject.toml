[project]
name = "blattwerk-api"
version = "0.0.0"  # product version comes from /VERSION at build time
description = "Backend of the blattwerk app"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.120",
  "uvicorn>=0.35",
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.16",
  "pywebpush>=2.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "httpx>=0.28",
  "defusedxml>=0.7",
  "mcp>=2.3",
  "pillow>=12.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx2>=2.13",  # what starlette's TestClient wants (httpx stays a runtime dependency)
    "ruff>=0.13",
    "mypy>=1.18",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blattwerk"]

[tool.uv]
# Only releases at least two weeks old (supply-chain hygiene, see the security rules).
exclude-newer = "2026-10-17T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["blattwerk"]
exclude = ["src/blattwerk/migrations/"]  # alembic scripts: dynamic, revision file names

[tool.pytest.ini_options]
filterwarnings = ["error"]  # a new deprecation fails the run (ticket 012)
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["pywebpush", "py_vapid"]  # no type information shipped
ignore_missing_imports = true
