# garten-planer on the Docker host, behind the existing Traefik. Copied there by
# scripts/deploy.sh, which writes the image tags, GP_HOST, TRAEFIK_NETWORK and a
# generated GP_DB_PASSWORD into the host's .env (never committed, never printed).
# Only the web container is reachable (through Traefik); database, migrations and
# api sit on an internal network without ports and without a route out.
services:
  db:
    image: postgres:17.10-alpine
    container_name: garten-planer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gartenplaner
      POSTGRES_PASSWORD: ${GP_DB_PASSWORD:?}
      POSTGRES_DB: garten_planer
    volumes:
      - db:/var/lib/postgresql/data
    networks: [backend]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]   # what the entrypoint needs (chown + su-exec)
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gartenplaner", "-d", "garten_planer"]
      interval: 10s
      retries: 10

  migrate:   # one-shot: Alembic migrations, then exits; the api starts only after it succeeded
    image: ${GARTEN_PLANER_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-migrate
    command: ["python", "-m", "garten_planer.migrate"]
    restart: "no"
    environment:
      GP_DATABASE_URL: postgresql+psycopg://gartenplaner:${GP_DB_PASSWORD:?}@db:5432/garten_planer
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${GARTEN_PLANER_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-api
    restart: unless-stopped
    environment:
      GP_DATABASE_URL: postgresql+psycopg://gartenplaner:${GP_DB_PASSWORD:?}@db:5432/garten_planer
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${GARTEN_PLANER_WEB_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [routing, backend]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?}"
      - "traefik.http.routers.garten-planer-http.rule=Host(`${GP_HOST:?}`)"
      - "traefik.http.routers.garten-planer-http.entrypoints=web"
      - "traefik.http.routers.garten-planer-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.garten-planer.rule=Host(`${GP_HOST:?}`)"
      - "traefik.http.routers.garten-planer.entrypoints=websecure"
      - "traefik.http.routers.garten-planer.tls=true"
      - "traefik.http.services.garten-planer.loadbalancer.server.port=8080"

volumes:
  db:

networks:
  backend:
    internal: true
  routing:
    name: ${TRAEFIK_NETWORK:?}
    external: true
