# blattwerk on the Docker host, behind the existing Traefik. Copied there by
# scripts/deploy.sh, which writes the image tags, BW_HOST, TRAEFIK_NETWORK and a
# generated BW_DB_PASSWORD into the host's .env (never committed, never printed).
# Only the web container is reachable (through Traefik); database, migrations and
# api sit on an internal network without ports and without a route out. The worker
# additionally joins `egress` (push services, Claude, DWD), and so does Telegraf
# (Home Assistant on this host, Open-Meteo). InfluxDB stays on the internal network.
services:
  db:
    image: postgres:17.10-alpine
    container_name: blattwerk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blattwerk
      POSTGRES_PASSWORD: ${BW_DB_PASSWORD:?}
      POSTGRES_DB: blattwerk
    volumes:
      - db:/var/lib/postgresql/data
    networks: [backend]
    read_only: true   # writes only to its volume, the socket dir and /tmp (tested: init, restart, dump/restore)
    tmpfs: ["/var/run/postgresql:uid=70,gid=70,mode=0775", /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]   # what the entrypoint needs (chown + su-exec)
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "blattwerk", "-d", "blattwerk"]
      interval: 10s
      retries: 10

  migrate:   # one-shot: Alembic migrations, then exits; the api starts only after it succeeded
    image: ${BLATTWERK_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: blattwerk-migrate
    command: ["python", "-m", "blattwerk.migrate"]
    restart: "no"
    environment:
      BW_DATABASE_URL: postgresql+psycopg://blattwerk:${BW_DB_PASSWORD:?}@db:5432/blattwerk
      BW_MCP_DB_PASSWORD: ${BW_MCP_DB_PASSWORD:?set by scripts/deploy.sh}   # the chat tools' role
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${BLATTWERK_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: blattwerk-api
    restart: unless-stopped
    environment:
      BW_DATABASE_URL: postgresql+psycopg://blattwerk:${BW_DB_PASSWORD:?}@db:5432/blattwerk
      BW_VAPID_PUBLIC: ${BW_VAPID_PUBLIC:-}
      BW_PLAN_DAILY_LIMIT: ${BW_PLAN_DAILY_LIMIT:-60}  # the api tells the user when it is reached
      BW_INFLUX_TOKEN: ${BW_INFLUX_TOKEN:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:   # push digest + outbox + care plans; the ONLY container with a route to the internet
    image: ${BLATTWERK_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: blattwerk-worker
    command: ["python", "-m", "blattwerk.worker"]
    restart: unless-stopped
    environment:
      BW_DATABASE_URL: postgresql+psycopg://blattwerk:${BW_DB_PASSWORD:?}@db:5432/blattwerk
      BW_VAPID_PUBLIC: ${BW_VAPID_PUBLIC:-}
      BW_VAPID_PRIVATE: ${BW_VAPID_PRIVATE:-}
      # Care plans (M5): Claude Code CLI, pinned and verified, installed into the volume at start
      BW_CLAUDE_VERSION: "2.1.296"
      BW_CLAUDE_SHA256: 24972e3bc859fab2b46ed4c1e51f7d6130f06d3bd550811a114640de3370d0de
      BW_CLAUDE_HOME: /claude
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      BW_PLAN_DAILY_LIMIT: ${BW_PLAN_DAILY_LIMIT:-60}
      BW_INFLUX_TOKEN: ${BW_INFLUX_TOKEN:-}
      BW_MCP_DB_PASSWORD: ${BW_MCP_DB_PASSWORD:?set by scripts/deploy.sh}   # chat tools: own role, read + proposals
      BW_LAT: ${BW_LAT:-}   # nearest DWD MOSMIX station
      BW_LON: ${BW_LON:-}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - claude:/claude
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    healthcheck:
      # push loop every 30 s; each AI loop (plan/name/chat) at least every 15 min - a CLI run ends after 5 min
      test: ["CMD", "python", "-c", "import glob, os, sys, time; t = time.time(); sys.exit(t - os.path.getmtime('/tmp/worker-alive') > 120 or any(t - os.path.getmtime(f) > 900 for f in glob.glob('/tmp/ai-alive-*')))"]
      interval: 30s
      start_period: 40s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  wetterwacht:   # weather alerts every 10 min: forecast (InfluxDB) -> alerts, urgent to-dos, push outbox (Postgres)
    image: ${BLATTWERK_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: blattwerk-wetterwacht
    command: ["python", "-m", "blattwerk.wetterwacht"]
    restart: unless-stopped
    environment:
      BW_DATABASE_URL: postgresql+psycopg://blattwerk:${BW_DB_PASSWORD:?}@db:5432/blattwerk
      BW_INFLUX_TOKEN: ${BW_INFLUX_TOKEN:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]   # no internet: it only reads InfluxDB and writes Postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/wetterwacht-alive') > 1500)"]
      interval: 60s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  influxdb:   # weather time series (M6); token file created once by deploy.sh in the influx-secret volume
    image: influxdb:3.11.8-core
    container_name: blattwerk-influxdb
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    # no Python plugin engine (the image enables it via INFLUXDB3_PLUGIN_DIR); health without token for the check
    command: ["unset INFLUXDB3_PLUGIN_DIR; exec influxdb3 serve --node-id garten --object-store file --data-dir /var/lib/influxdb3/data --admin-token-file /secret/admin.json --disable-telemetry-upload --disable-authz health"]
    volumes:
      - influx:/var/lib/influxdb3
      - influx-secret:/secret:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8181/health"]
      interval: 15s
      start_period: 20s
      retries: 5

  influx-init:   # one-shot: database "garten" with 2 years retention, before Telegraf writes
    image: ${BLATTWERK_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: blattwerk-influx-init
    command: ["python", "-m", "blattwerk.influx", "init"]
    restart: "no"
    environment:
      BW_INFLUX_TOKEN: ${BW_INFLUX_TOKEN:?set by scripts/deploy.sh}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      influxdb:
        condition: service_healthy

  telegraf:   # Home Assistant every 5 min, Open-Meteo hourly -> InfluxDB (deploy/telegraf.conf)
    image: telegraf:1.39.3-alpine
    container_name: blattwerk-telegraf
    profiles: [weather]   # deploy.sh enables it only when Home Assistant is configured
    restart: unless-stopped
    user: "100:101"   # the image's telegraf user; no root setup (setcap) needed
    command: ["telegraf", "--config", "/etc/telegraf/telegraf.conf"]
    environment:
      BW_INFLUX_TOKEN: ${BW_INFLUX_TOKEN:-}
      BW_HA_URL: ${BW_HA_URL:-}
      BW_HA_TOKEN: ${BW_HA_TOKEN:-}
      BW_LAT_KM: ${BW_LAT_KM:-}   # rounded to about 1 km by deploy.sh: Open-Meteo and logs never see more
      BW_LON_KM: ${BW_LON_KM:-}
      BW_HA_OUTDOOR: ${BW_HA_OUTDOOR:-}
      BW_HA_GREENHOUSE: ${BW_HA_GREENHOUSE:-}
      BW_HA_RAIN_DAY: ${BW_HA_RAIN_DAY:-}
      BW_HA_RAIN_RATE: ${BW_HA_RAIN_RATE:-}
      BW_HA_WIND: ${BW_HA_WIND:-}
      BW_HA_GUST: ${BW_HA_GUST:-}
      BW_HA_SOLAR: ${BW_HA_SOLAR:-}
      BW_HA_SOIL_1: ${BW_HA_SOIL_1:-}
      BW_HA_SOIL_1_LABEL: ${BW_HA_SOIL_1_LABEL:-}
      BW_HA_SOIL_2: ${BW_HA_SOIL_2:-}
      BW_HA_SOIL_2_LABEL: ${BW_HA_SOIL_2_LABEL:-}
      BW_HA_SOIL_3: ${BW_HA_SOIL_3:-}
      BW_HA_SOIL_3_LABEL: ${BW_HA_SOIL_3_LABEL:-}
      BW_HA_SOIL_4: ${BW_HA_SOIL_4:-}
      BW_HA_SOIL_4_LABEL: ${BW_HA_SOIL_4_LABEL:-}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    extra_hosts: ["homeassistant-host:host-gateway"]   # Home Assistant runs on this host (BW_HA_URL uses this name)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080"]
      interval: 30s
      start_period: 30s
      retries: 3
    depends_on:
      influx-init:
        condition: service_completed_successfully

  web:
    image: ${BLATTWERK_WEB_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: blattwerk-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [routing, backend]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?}"
      - "traefik.http.routers.blattwerk-http.rule=Host(`${BW_HOST:?}`)"
      - "traefik.http.routers.blattwerk-http.entrypoints=web"
      - "traefik.http.routers.blattwerk-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.blattwerk.rule=Host(`${BW_HOST:?}`)"
      - "traefik.http.routers.blattwerk.entrypoints=websecure"
      - "traefik.http.routers.blattwerk.tls=true"
      - "traefik.http.services.blattwerk.loadbalancer.server.port=8080"
      # the former address (garten-planer, renamed 2026-11-01): old bookmarks and home-screen icons land here
      - "traefik.http.routers.blattwerk-moved.rule=Host(`${BW_OLD_HOST:-moved.invalid}`)"
      - "traefik.http.routers.blattwerk-moved.entrypoints=websecure"
      - "traefik.http.routers.blattwerk-moved.tls=true"
      - "traefik.http.routers.blattwerk-moved.middlewares=blattwerk-moved"
      - "traefik.http.middlewares.blattwerk-moved.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.blattwerk-moved.redirectregex.replacement=https://${BW_HOST:?}/$${1}"
      - "traefik.http.middlewares.blattwerk-moved.redirectregex.permanent=true"

volumes:
  db:
  claude:   # Claude Code CLI + its config; no transcripts (--no-session-persistence)
  influx:
  influx-secret:   # InfluxDB admin token file (uid 1500, mode 400); its token is also in .env
    name: blattwerk-influx-secret
    external: true   # deploy.sh creates it (token file) before compose up

networks:
  backend:
    internal: true
  egress: {}   # normal bridge with internet: worker and telegraf
  routing:
    name: ${TRAEFIK_NETWORK:?}
    external: true
