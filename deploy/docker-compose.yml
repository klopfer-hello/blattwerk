# garten-planer on the Docker host, behind the existing Traefik. Copied there by
# scripts/deploy.sh, which writes the image tags, GP_HOST, TRAEFIK_NETWORK and a
# generated GP_DB_PASSWORD into the host's .env (never committed, never printed).
# Only the web container is reachable (through Traefik); database, migrations and
# api sit on an internal network without ports and without a route out. The worker
# additionally joins `egress` (push services, Claude, DWD), and so does Telegraf
# (Home Assistant on this host, Open-Meteo). InfluxDB stays on the internal network.
services:
  db:
    image: postgres:17.10-alpine
    container_name: garten-planer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gartenplaner
      POSTGRES_PASSWORD: ${GP_DB_PASSWORD:?}
      POSTGRES_DB: garten_planer
    volumes:
      - db:/var/lib/postgresql/data
    networks: [backend]
    read_only: true   # writes only to its volume, the socket dir and /tmp (tested: init, restart, dump/restore)
    tmpfs: ["/var/run/postgresql:uid=70,gid=70,mode=0775", /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]   # what the entrypoint needs (chown + su-exec)
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gartenplaner", "-d", "garten_planer"]
      interval: 10s
      retries: 10

  migrate:   # one-shot: Alembic migrations, then exits; the api starts only after it succeeded
    image: ${GARTEN_PLANER_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-migrate
    command: ["python", "-m", "garten_planer.migrate"]
    restart: "no"
    environment:
      GP_DATABASE_URL: postgresql+psycopg://gartenplaner:${GP_DB_PASSWORD:?}@db:5432/garten_planer
      GP_MCP_DB_PASSWORD: ${GP_MCP_DB_PASSWORD:?set by scripts/deploy.sh}   # the chat tools' role
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${GARTEN_PLANER_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-api
    restart: unless-stopped
    environment:
      GP_DATABASE_URL: postgresql+psycopg://gartenplaner:${GP_DB_PASSWORD:?}@db:5432/garten_planer
      GP_VAPID_PUBLIC: ${GP_VAPID_PUBLIC:-}
      GP_PLAN_DAILY_LIMIT: ${GP_PLAN_DAILY_LIMIT:-60}  # the api tells the user when it is reached
      GP_INFLUX_TOKEN: ${GP_INFLUX_TOKEN:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:   # push digest + outbox + care plans; the ONLY container with a route to the internet
    image: ${GARTEN_PLANER_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-worker
    command: ["python", "-m", "garten_planer.worker"]
    restart: unless-stopped
    environment:
      GP_DATABASE_URL: postgresql+psycopg://gartenplaner:${GP_DB_PASSWORD:?}@db:5432/garten_planer
      GP_VAPID_PUBLIC: ${GP_VAPID_PUBLIC:-}
      GP_VAPID_PRIVATE: ${GP_VAPID_PRIVATE:-}
      # Care plans (M5): Claude Code CLI, pinned and verified, installed into the volume at start
      GP_CLAUDE_VERSION: "2.1.296"
      GP_CLAUDE_SHA256: 24972e3bc859fab2b46ed4c1e51f7d6130f06d3bd550811a114640de3370d0de
      GP_CLAUDE_HOME: /claude
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      GP_PLAN_DAILY_LIMIT: ${GP_PLAN_DAILY_LIMIT:-60}
      GP_INFLUX_TOKEN: ${GP_INFLUX_TOKEN:-}
      GP_MCP_DB_PASSWORD: ${GP_MCP_DB_PASSWORD:?set by scripts/deploy.sh}   # chat tools: own role, read + proposals
      GP_LAT: ${GP_LAT:-}   # nearest DWD MOSMIX station
      GP_LON: ${GP_LON:-}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - claude:/claude
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 120)"]
      interval: 30s
      start_period: 40s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  wetterwacht:   # weather alerts every 10 min: forecast (InfluxDB) -> alerts, urgent to-dos, push outbox (Postgres)
    image: ${GARTEN_PLANER_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-wetterwacht
    command: ["python", "-m", "garten_planer.wetterwacht"]
    restart: unless-stopped
    environment:
      GP_DATABASE_URL: postgresql+psycopg://gartenplaner:${GP_DB_PASSWORD:?}@db:5432/garten_planer
      GP_INFLUX_TOKEN: ${GP_INFLUX_TOKEN:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]   # no internet: it only reads InfluxDB and writes Postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/wetterwacht-alive') > 1500)"]
      interval: 60s
      start_period: 60s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  influxdb:   # weather time series (M6); token file created once by deploy.sh in the influx-secret volume
    image: influxdb:3.11.8-core
    container_name: garten-planer-influxdb
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    # no Python plugin engine (the image enables it via INFLUXDB3_PLUGIN_DIR); health without token for the check
    command: ["unset INFLUXDB3_PLUGIN_DIR; exec influxdb3 serve --node-id garten --object-store file --data-dir /var/lib/influxdb3/data --admin-token-file /secret/admin.json --disable-telemetry-upload --disable-authz health"]
    volumes:
      - influx:/var/lib/influxdb3
      - influx-secret:/secret:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8181/health"]
      interval: 15s
      start_period: 20s
      retries: 5

  influx-init:   # one-shot: database "garten" with 2 years retention, before Telegraf writes
    image: ${GARTEN_PLANER_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-influx-init
    command: ["python", "-m", "garten_planer.influx", "init"]
    restart: "no"
    environment:
      GP_INFLUX_TOKEN: ${GP_INFLUX_TOKEN:?set by scripts/deploy.sh}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      influxdb:
        condition: service_healthy

  telegraf:   # Home Assistant every 5 min, Open-Meteo hourly -> InfluxDB (deploy/telegraf.conf)
    image: telegraf:1.39.3-alpine
    container_name: garten-planer-telegraf
    profiles: [weather]   # deploy.sh enables it only when Home Assistant is configured
    restart: unless-stopped
    user: "100:101"   # the image's telegraf user; no root setup (setcap) needed
    command: ["telegraf", "--config", "/etc/telegraf/telegraf.conf"]
    environment:
      GP_INFLUX_TOKEN: ${GP_INFLUX_TOKEN:-}
      GP_HA_URL: ${GP_HA_URL:-}
      GP_HA_TOKEN: ${GP_HA_TOKEN:-}
      GP_LAT_KM: ${GP_LAT_KM:-}   # rounded to about 1 km by deploy.sh: Open-Meteo and logs never see more
      GP_LON_KM: ${GP_LON_KM:-}
      GP_HA_OUTDOOR: ${GP_HA_OUTDOOR:-}
      GP_HA_GREENHOUSE: ${GP_HA_GREENHOUSE:-}
      GP_HA_RAIN_DAY: ${GP_HA_RAIN_DAY:-}
      GP_HA_RAIN_RATE: ${GP_HA_RAIN_RATE:-}
      GP_HA_WIND: ${GP_HA_WIND:-}
      GP_HA_GUST: ${GP_HA_GUST:-}
      GP_HA_SOLAR: ${GP_HA_SOLAR:-}
      GP_HA_SOIL_1: ${GP_HA_SOIL_1:-}
      GP_HA_SOIL_1_LABEL: ${GP_HA_SOIL_1_LABEL:-}
      GP_HA_SOIL_2: ${GP_HA_SOIL_2:-}
      GP_HA_SOIL_2_LABEL: ${GP_HA_SOIL_2_LABEL:-}
      GP_HA_SOIL_3: ${GP_HA_SOIL_3:-}
      GP_HA_SOIL_3_LABEL: ${GP_HA_SOIL_3_LABEL:-}
      GP_HA_SOIL_4: ${GP_HA_SOIL_4:-}
      GP_HA_SOIL_4_LABEL: ${GP_HA_SOIL_4_LABEL:-}
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    extra_hosts: ["homeassistant-host:host-gateway"]   # Home Assistant runs on this host (GP_HA_URL uses this name)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080"]
      interval: 30s
      start_period: 30s
      retries: 3
    depends_on:
      influx-init:
        condition: service_completed_successfully

  web:
    image: ${GARTEN_PLANER_WEB_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [routing, backend]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?}"
      - "traefik.http.routers.garten-planer-http.rule=Host(`${GP_HOST:?}`)"
      - "traefik.http.routers.garten-planer-http.entrypoints=web"
      - "traefik.http.routers.garten-planer-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.garten-planer.rule=Host(`${GP_HOST:?}`)"
      - "traefik.http.routers.garten-planer.entrypoints=websecure"
      - "traefik.http.routers.garten-planer.tls=true"
      - "traefik.http.services.garten-planer.loadbalancer.server.port=8080"

volumes:
  db:
  claude:   # Claude Code CLI + its config; no transcripts (--no-session-persistence)
  influx:
  influx-secret:   # InfluxDB admin token file (uid 1500, mode 400); its token is also in .env
    name: garten-planer-influx-secret
    external: true   # deploy.sh creates it (token file) before compose up

networks:
  backend:
    internal: true
  egress: {}   # normal bridge with internet: worker and telegraf
  routing:
    name: ${TRAEFIK_NETWORK:?}
    external: true
