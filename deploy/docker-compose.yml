# garten-planer on the Docker host, behind the existing Traefik. Copied there by
# scripts/deploy.sh, which writes the image tags, GP_HOST, TRAEFIK_NETWORK and a
# generated GP_DB_PASSWORD into the host's .env (never committed, never printed).
# Only the web container is reachable (through Traefik); database and api sit on
# an internal network without ports and without a route out.
services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    container_name: garten-planer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gartenplaner
      POSTGRES_PASSWORD: ${GP_DB_PASSWORD:?}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gartenplaner", "-d", "postgres"]
      interval: 10s
      retries: 10

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: garten-planer-ferretdb
    restart: unless-stopped
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://gartenplaner:${GP_DB_PASSWORD:?}@postgres:5432/postgres
      FERRETDB_TELEMETRY: disable
      FERRETDB_STATE_DIR: /state
    tmpfs: ["/state:uid=1000,gid=1000,mode=0700"]   # FerretDB runs as 1000:1000
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${GARTEN_PLANER_API_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-api
    restart: unless-stopped
    environment:
      GP_MONGO_URL: mongodb://gartenplaner:${GP_DB_PASSWORD:?}@ferretdb:27017/
      GP_DB_NAME: garten_planer
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    depends_on: [ferretdb]

  web:
    image: ${GARTEN_PLANER_WEB_IMAGE:?set by scripts/deploy.sh}
    pull_policy: never
    container_name: garten-planer-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [routing, backend]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:?}"
      - "traefik.http.routers.garten-planer-http.rule=Host(`${GP_HOST:?}`)"
      - "traefik.http.routers.garten-planer-http.entrypoints=web"
      - "traefik.http.routers.garten-planer-http.middlewares=redirect-to-https@file"
      - "traefik.http.routers.garten-planer.rule=Host(`${GP_HOST:?}`)"
      - "traefik.http.routers.garten-planer.entrypoints=websecure"
      - "traefik.http.routers.garten-planer.tls=true"
      - "traefik.http.services.garten-planer.loadbalancer.server.port=8080"

volumes:
  pgdata:

networks:
  backend:
    internal: true
  routing:
    name: ${TRAEFIK_NETWORK:?}
    external: true
