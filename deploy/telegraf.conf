# Telegraf (M6): Home Assistant sensors every 5 min + Open-Meteo forecast hourly → InfluxDB 3.
# Only ${...} placeholders here: URL, token, entity ids and coordinates come from the host's .env.
# DWD MOSMIX (zipped KML) is fetched by the worker, Telegraf cannot unpack it.

[agent]
  interval = "5m"
  round_interval = true
  flush_interval = "30s"
  omit_hostname = true
  skip_processors_after_aggregators = false   # keep today's behaviour explicitly (default changes in 1.40)

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8181"]
  token = "${GP_INFLUX_TOKEN}"
  organization = "garten"
  bucket = "garten"

[[outputs.health]]  # healthcheck: unhealthy when no Home Assistant value arrived in the last interval
  service_address = "http://127.0.0.1:8080"
  namepass = ["ha"]
  [[outputs.health.contains]]
    field = "value"

# ----- Home Assistant: one block per sensor kind, the kind (and soil label) as tags -----

[[inputs.http]]
  urls = [
    "${GP_HA_URL}/api/states/${GP_HA_OUTDOOR}",
  ]
  headers = { Authorization = "Bearer ${GP_HA_TOKEN}" }
  timeout = "10s"
  name_override = "ha"
  tagexclude = ["url"]
  data_format = "json_v2"
  tags = { kind = "outdoor" }
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "state"
      rename = "value"
      type = "float"

