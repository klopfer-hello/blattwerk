# ----- Open-Meteo hourly forecast (CSV: 3 metadata lines, then a header) -----

[[inputs.http]]
  interval = "1h"
  urls = ["https://api.open-meteo.com/v1/forecast?latitude=${GP_LAT_KM}&longitude=${GP_LON_KM}&hourly=temperature_2m,soil_temperature_0cm,precipitation,wind_gusts_10m&forecast_days=4&timezone=GMT&format=csv"]
  timeout = "20s"
  name_override = "weather_fc"
  tagexclude = ["url"]
  data_format = "csv"
  csv_skip_rows = 3
  csv_header_row_count = 1
  csv_timestamp_column = "time"
  csv_timestamp_format = "2006-01-02T15:04"
  csv_timezone = "UTC"
  tags = { source = "openmeteo" }

[[processors.rename]]
  namepass = ["weather_fc"]
  [[processors.rename.replace]]
    field = "temperature_2m (°C)"
    dest = "t_air"
  [[processors.rename.replace]]
    field = "soil_temperature_0cm (°C)"
    dest = "t_ground"
  [[processors.rename.replace]]
    field = "precipitation (mm)"
    dest = "precip"
  [[processors.rename.replace]]
    field = "wind_gusts_10m (km/h)"
    dest = "gust"

[[processors.starlark]]  # when the forecast was fetched: the api reports an old forecast as old
  namepass = ["weather_fc"]
  source = '''
load("time.star", "time")
def apply(metric):
    metric.fields["fetched"] = float(time.now().unix)
    return metric
'''
