# Static SPA served by unprivileged nginx (port 8080, read-only root fs).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        alias /usr/share/nginx/html/version.txt;
    }
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # API: resolved per request through Docker's DNS, so nginx starts even
    # while the api container is down (then 502 until it is back). The unique
    # container name, not the service name "api": this container is also on the
    # shared Traefik network, where another stack could have an "api" service.
    # $http_host keeps the port, so the API's same-origin check matches Origin.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://blattwerk-api:8000;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }
    # Plant doctor (M9): the one route with an image body (the api checks it again, max 8 MB).
    location = /api/photos {
        include /etc/nginx/security-headers.conf;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://blattwerk-api:8000;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 8m;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
